name: SPARK offline tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Matrix-free reference tests (no model download)
        run: python -m unittest discover -s tests -v
