name: SPARK M9 conditional symbolic programs
on:
  pull_request:
    branches: [main]
    paths:
      - 'spark/symbolic_control.py'
      - 'tools/control_experiment.py'
      - 'tests/test_symbolic_control.py'
      - '.github/workflows/symbolic-control.yml'
  push:
    paths:
      - 'spark/symbolic_control.py'
      - 'tools/control_experiment.py'
      - 'tests/test_symbolic_control.py'
      - '.github/workflows/symbolic-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-compile-and-extrapolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic training dependency
        run: python -m pip install numpy
      - name: Run M8 and M9 regression tests
        run: python -m unittest discover -s tests -p 'test_symbolic*.py' -v
      - name: Synthesize and natively compile three new programs
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python tools/control_experiment.py --output artifacts/symbolic-m9
      - name: Assert unseen-data and long-rollout correctness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/symbolic-m9/report.json").read_text())
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## SPARK M9 discovered conditional recurrence\n\n")
              for name in ("reset","clamp","nonlinear"):
                  x=r[name]
                  assert x["ood_test"]==300, x
                  assert x["ood"]["exact_fraction"]==1.0, x
                  assert x["ood"]["mse"]<1e-18, x
                  assert x["native_max_step_difference"]<1e-10, x
                  assert x["python_exact_rollouts"]==48, x
                  assert x["native_exact_rollouts"]==48, x
                  assert x["unbranched_degree3_ood"]["mse"]>x["ood"]["mse"], x
                  f.write(f"- {name}: {x['branches']} guards; OOD MSE {x['ood']['mse']:.3e}; native 48/48 rollouts\n")
              f.write("\nSynthetic grammar-constrained tasks only; not a Transformer comparison.\n")
          PY
      - name: Save generated C++ programs, native libraries and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-m9-conditional-programs
          path: artifacts/symbolic-m9/
          retention-days: 14
