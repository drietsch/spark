name: ModernBERT checkpoint download and function export
on:
  push:
    branches:
      - 'codex/modernbert-transfer-*'
    paths:
      - '.github/workflows/modernbert-transfer-runner.yml'
      - 'tools/modernbert_runner_export.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HOME: ${{ runner.temp }}/modernbert-hub
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU teacher dependencies with TLS verification
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==2.2.6 transformers==4.51.3 safetensors==0.5.3
      - name: Download the real checkpoint and export a mathematical function
        id: export
        continue-on-error: true
        run: python tools/modernbert_runner_export.py --output artifacts/modernbert-transfer-runner
      - name: Return data through an isolated results branch
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/modernbert-transfer-runner')
          p.mkdir(parents=True,exist_ok=True)
          report=p/'runner-report.json'
          if not report.exists():
              report.write_text(json.dumps({'status':'failed','stage':'dependency-installation','workflow_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${GITHUB_REF_NAME}-results"
          git add -f artifacts/modernbert-transfer-runner
          git commit -m 'Return ModernBERT checkpoint export and validation data'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernbert-function-export
          path: artifacts/modernbert-transfer-runner/
          retention-days: 1
      - name: Preserve download/export failure status
        if: steps.export.outcome != 'success'
        run: exit 1
